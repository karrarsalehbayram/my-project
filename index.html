.card:hover img.loaded{transform:scale(1.06)}
.card-num{position:absolute;top:14px;inset-inline-start:14px;z-index:2;font-family:var(--f-head-en);font-size:.9rem;letter-spacing:.04em;padding:.3em .8em;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(28,31,74,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff}
.card-badge{position:absolute;top:14px;inset-inline-end:14px;z-index:2;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:.45em .9em;border-radius:999px;background:var(--lime);color:var(--dark)}
html[lang="ar"] .card-badge{letter-spacing:0;font-size:.82rem}
.card-info{position:absolute;inset:auto 0 0 0;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:clamp(14px,1.6vw,22px);padding-top:56px;background:linear-gradient(to top,rgba(24,22,66,.92) 15%,rgba(24,22,66,0));color:#fff}
.card-info .type{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#D2D2CB;margin-bottom:4px}
html[lang="ar"] .card-info .type{letter-spacing:0;font-size:.82rem}
.card-info h3{font-family:var(--f-head);font-weight:400;font-size:clamp(1.15rem,1.7vw,1.6rem);line-height:1.05;text-transform:uppercase}
html[lang="ar"] .card-info h3{line-height:1.35}
.featured .card-info h3{font-size:clamp(1.4rem,2.3vw,2.2rem)}
.card .pill{transform:translateY(0)}
.card-in{animation:cardIn .8s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(36px) scale(.97)}to{opacity:1;transform:none}}
.empty{grid-column:1/-1;display:grid;place-items:center;border:1px dashed var(--card-line);border-radius:var(--radius);color:var(--muted)}
.proj-more{display:flex;justify-content:center;margin-top:clamp(40px,5vw,64px)}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.featured{grid-template-columns:1fr}.featured .card{aspect-ratio:16/11}}
@media (max-width:520px){.bento{grid-template-columns:1fr;grid-auto-rows:270px}.card.xl,.card.wide{grid-column:auto}.card.xl,.card.tall{grid-row:auto}.featured .card{aspect-ratio:4/5}}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:clamp(16px,4vw,56px);background:rgba(24,22,66,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
.lb.open{opacity:1;visibility:visible}
.lb figure{display:flex;flex-direction:column;gap:16px;max-width:min(1100px,100%);max-height:100%;transform:scale(.96);transition:transform .5s var(--ease)}
.lb.open figure{transform:none}
.lb img{max-width:100%;max-height:calc(100svh - 190px);width:auto;margin-inline:auto;border-radius:24px;border:1px solid rgba(255,255,255,.6);object-fit:contain;background:#fff}
.lb figcaption{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:6px 16px;text-align:center;color:var(--light)}
.lb figcaption strong{font-family:var(--f-head);font-weight:400;font-size:clamp(1.4rem,3vw,2.2rem);text-transform:uppercase;line-height:1.2}
.lb figcaption span{color:#ABABA4;font-size:.9rem}
.lb-btn{position:absolute;z-index:2;width:54px;height:54px;padding:0;border-radius:50%}
.lb-btn svg{width:22px;height:22px}
.lb-close{top:clamp(12px,2vw,24px);inset-inline-end:clamp(12px,2vw,24px)}
.lb-prev{top:50%;inset-inline-start:clamp(8px,2vw,24px);margin-top:-27px}
.lb-next{top:50%;inset-inline-end:clamp(8px,2vw,24px);margin-top:-27px}
[dir="rtl"] .lb-prev svg,[dir="rtl"] .lb-next svg{transform:scaleX(-1)}
@media (max-width:640px){.lb-prev,.lb-next{top:auto;bottom:16px;margin-top:0}}

/* ---------- Testimonials ---------- */
.t-title{display:flex;flex-wrap:wrap;align-items:center;gap:.25em;font-size:clamp(2.6rem,7.8vw,7.4rem);margin-bottom:clamp(40px,5vw,72px)}
.t-emoji{display:inline-block;font-size:1.05em;line-height:1;animation:wobble 3.2s ease-in-out infinite;transform-origin:70% 80%}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}}
.t-row{overflow:hidden;direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.t-track{display:flex;align-items:stretch;width:max-content;animation:mq 70s linear infinite}
.t-row:hover .t-track,.t-row:focus-within .t-track{animation-play-state:paused}
.t-card{width:clamp(290px,34vw,460px);margin-inline:clamp(8px,1vw,12px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(26px,3vw,40px);border-radius:var(--radius);border:1px solid var(--card-line);background:#fff;box-shadow:var(--shadow);transition:transform .5s var(--ease)}
.t-card:hover{transform:translateY(-8px) rotate(-.6deg)}
.t-card .q{font-family:var(--f-head-en);font-size:4.2rem;line-height:.6;color:var(--pink);height:.45em}
.t-card blockquote{font-size:clamp(1.02rem,1.35vw,1.2rem);line-height:1.65}
.t-card footer{display:flex;align-items:center;gap:14px}
.t-card .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:1.2rem;color:var(--dark);flex:none}
.t-card cite{font-style:normal;display:flex;flex-direction:column;line-height:1.3}
.t-card cite b{font-weight:700}
.t-card cite span{font-size:.85rem;color:var(--muted)}

/* ---------- Contact (light) ---------- */
.contact-title{font-size:clamp(3.2rem,11vw,11rem)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,6vw,90px);margin-top:clamp(36px,5vw,64px);align-items:start}
.contact-intro{font-size:clamp(1.05rem,1.5vw,1.25rem);max-width:38ch;margin-bottom:28px}
.socials{display:flex;flex-wrap:wrap;gap:12px}
.form{display:grid;gap:18px;padding:clamp(24px,3vw,40px);border:1px solid var(--card-line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.form h3{font-family:var(--f-head);font-weight:400;font-size:clamp(1.6rem,2.6vw,2.2rem);text-transform:uppercase;line-height:1.1}
.field label{display:block;margin-bottom:8px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em}
html[lang="ar"] .field label{letter-spacing:0;font-size:.92rem}
.field input,.field textarea{width:100%;padding:14px 18px;border-radius:18px;border:1px solid rgba(28,31,74,.2);background:var(--light);color:var(--dark);font:inherit;transition:border-color .3s,box-shadow .3s}
.field textarea{min-height:140px;resize:vertical;border-radius:22px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(123,63,242,.25)}
.form-note{font-size:.85rem;color:var(--muted)}
.form-err{font-size:.9rem;color:#B00052;font-weight:700}
.form .pill{justify-self:start}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.site-foot{padding-block:clamp(70px,9vw,120px) 28px}
.outline-box{text-align:center;margin-bottom:clamp(28px,4vw,48px)}
.outline-name{display:inline-block;white-space:nowrap;font-family:var(--f-head);text-transform:uppercase;line-height:1.05;color:transparent;-webkit-text-stroke:1.5px var(--light)}
html[lang="ar"] .outline-name{line-height:1.35}
.foot-social{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin-bottom:clamp(36px,5vw,56px)}
.foot-social a{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.82);transition:color .3s}
html[lang="ar"] .foot-social a{letter-spacing:0;font-size:.95rem}
.foot-social a:hover{color:#FFD3E0}
.geo{width:clamp(46px,5.5vw,78px);margin-inline:clamp(14px,2vw,30px);flex:none}
.geo svg{width:100%;height:auto}
.foot-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;margin-top:clamp(36px,5vw,56px);padding-top:22px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.foot-bar a:hover{color:#fff}

/* ---------- Motion & interactivity ---------- */
@keyframes shine{to{background-position:300% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sec-num{background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;animation:shine 10s linear infinite}
.site-foot .sec-num{background:linear-gradient(90deg,#fff,#FFD3E0,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
.logo i,.counter .num .plus{background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.blobs{isolation:isolate}
.blobs::before,.blobs::after{content:"";position:absolute;z-index:0;pointer-events:none;border-radius:50%;filter:blur(30px);animation:drift 22s ease-in-out infinite alternate}
.blobs::before{width:min(60vw,720px);aspect-ratio:1;top:-18%;inset-inline-start:-14%;background:radial-gradient(circle,rgba(108,75,255,.28),transparent 66%)}
.blobs::after{width:min(52vw,640px);aspect-ratio:1;bottom:-20%;inset-inline-end:-12%;background:radial-gradient(circle,rgba(255,92,138,.24),rgba(255,162,76,.12) 45%,transparent 68%);animation-duration:26s;animation-direction:alternate-reverse}
.portrait .fig{animation:floaty 6s ease-in-out infinite}
.portrait{translate:var(--px,0) var(--py,0);transition:translate .6s var(--ease)}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:120;background:var(--grad);background-size:200% 100%;transform-origin:left;transform:scaleX(0);pointer-events:none}
[dir="rtl"] .progress{transform-origin:right}
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;z-index:150;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .3s,width .35s var(--ease),height .35s var(--ease),background .35s,border-color .35s}
.cursor-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--pink)}
.cursor-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid rgba(108,75,255,.55)}
.cursor-ring.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:rgba(255,92,138,.12);border-color:rgba(255,92,138,.6)}
.has-cursor .cursor-dot,.has-cursor .cursor-ring{opacity:1}
.chip{transition:transform .4s var(--ease),background .4s,color .4s,border-color .4s}
.chip:hover{transform:translateY(-3px);background:var(--dark);color:#fff;border-color:var(--dark)}
.counter{transition:background .5s var(--ease)}
.counter:hover{background:rgba(108,75,255,.07)}

/* ---------- Hover preview (full design on hover, desktop only) ---------- */
.hp{position:fixed;z-index:110;top:50%;left:0;pointer-events:none;width:min(40vw,560px);display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:26px;background:#fff;box-shadow:0 40px 90px -30px rgba(28,31,74,.55),0 0 0 1px rgba(28,31,74,.06);opacity:0;visibility:hidden;transform:translate(var(--hx,0),-50%) scale(.94);transition:opacity .3s var(--ease),transform .45s var(--ease),visibility .3s}
.hp.show{opacity:1;visibility:visible;transform:translate(var(--hx,0),-50%) scale(1)}
.hp img{width:100%;max-height:calc(86vh - 70px);object-fit:contain;border-radius:18px;background:var(--mist)}
.hp figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 6px 2px;color:var(--dark)}
.hp strong{font-family:var(--f-head);font-weight:400;font-size:1.15rem;line-height:1.3}
.hp span{font-size:.82rem;color:#5A5E88;white-space:nowrap}
@media (hover:none),(pointer:coarse),(max-width:900px){.hp{display:none}}
/* ---------- Scroll reveal ---------- */
html.js .reveal{opacity:0;transform:translateY(46px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--rd,0s)}
html.js .reveal.in{opacity:1;transform:none}

/* ---------- Reduced motion: keep gentle fades and slow marquees, drop large or continuous movement ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  html.js .reveal{transform:none}
  .blobs::before,.blobs::after,.portrait .fig,.shape .float,.portrait .ring,.t-emoji{animation:none!important}
  .card{transform:none!important}
  .mq-track{animation-duration:140s!important}
  .t-track{animation-duration:180s!important}
  .cursor-dot,.cursor-ring{display:none}
}
</style>
</head>

<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
<figure class="hp" id="hp" aria-hidden="true"><img alt="" decoding="async"><figcaption><strong></strong><span></span></figcaption></figure>
<a class="skip" href="#main" data-i18n="nav.skip">تخطَّ إلى المحتوى</a>

<!-- ============ NAV ============ -->
<header class="nav" id="nav">
  <div class="wrap">
    <a href="#top" class="logo" data-i18n-attr="aria-label:nav.home"><span data-i18n="nav.logo">كرار</span><i>.</i></a>

      <ul class="nav-links" id="navLinks">

</header>

<main id="main">

<!-- ============ 01 HERO (dark) ============ -->

      <div class="shape" data-shape="ai" data-speed=".16" style="--s:clamp(70px,9vw,145px);top:40%;inset-inline-start:4%;--d:-2s;--r:10deg"></div>
      <div class="shape" data-shape="play" data-speed="-.2" style="--s:clamp(60px,7vw,115px);bottom:22%;inset-inline-end:28%;--d:-4s;--r:-8deg"></div>

        <p class="hero-sub"><strong data-i18n="hero.sub"></strong><span class="muted" data-i18n="hero.based"></span></p>
        <a class="pill lg" data-social="whatsapp" target="_blank" rel="noopener">
          <span data-i18n="hero.cta"></span>
          <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</section>

<!-- ============ MARQUEE (dark) ============ -->
<section class="marquee dark" aria-hidden="true" style="padding-block:clamp(28px,4vw,56px)">
  <div class="mq" style="--dur:50s"><div class="mq-track" id="mqServices"></div></div>
  <div class="mq rev" style="--dur:60s"><div class="mq-track" id="mqTiles"></div></div>
</section>

<!-- ============ 02 ABOUT (dark) ============ -->
<section class="about dark" id="about" aria-labelledby="aboutTitle">
  <div class="shape" data-shape="football" data-speed=".22" style="--s:clamp(70px,9vw,140px);top:5%;inset-inline-start:32%;--d:-1s"></div>
  <div class="shape" data-shape="pen" data-speed="-.18" style="--s:clamp(64px,8vw,130px);top:9%;inset-inline-end:3%;--d:-3s;--r:-10deg"></div>
  <div class="shape" data-shape="cap" data-speed=".14" style="--s:clamp(80px,10vw,160px);bottom:4%;inset-inline-end:4%;--d:-5s;--r:8deg"></div>
  <div class="wrap">
    <div class="sec-head reveal"><span class="sec-num" aria-hidden="true">02</span><span class="sec-label" data-i18n="about.label"></span></div>

      <h2 class="display about-title reveal" id="aboutTitle" data-i18n="about.title"></h2>

      <div class="counter"><div class="num"><span class="plus">+</span><span class="cnt" data-count="projects">0</span></div><p data-i18n="about.counters.projects"></p></div>
      <div class="counter"><div class="num"><span class="plus">+</span><span class="cnt" data-count="clients">0</span></div><p data-i18n="about.counters.clients"></p></div>
    </div>
  </div>
</section>

<!-- ============ 03 SERVICES (light) ============ -->
<section class="services light" id="services" aria-labelledby="svcTitle">
  <div class="shape" data-shape="printer" data-speed=".18" style="--s:clamp(70px,9vw,150px);top:6%;inset-inline-end:4%;--d:-2s;--r:6deg"></div>
  <div class="shape" data-shape="plane" data-speed="-.2" style="--s:clamp(64px,8vw,130px);bottom:5%;inset-inline-start:2%;--d:-4s"></div>
  <div class="wrap">
    <div class="sec-head reveal"><span class="sec-num" aria-hidden="true">03</span><span class="sec-label" data-i18n="services.label"></span></div>

      <h2 class="display svc-title reveal" id="svcTitle" data-i18n="services.title"></h2>

<!-- ============ 04 PROJECTS (dark) ============ -->

        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

</section>

<!-- ============ 05 TESTIMONIALS (dark) ============ -->
<section class="testimonials light" aria-labelledby="tTitle">

    <div class="sec-head reveal"><span class="sec-num" aria-hidden="true">05</span><span class="sec-label" data-i18n="testimonials.label"></span></div>
    <h2 class="display t-title reveal" id="tTitle"><span data-i18n="testimonials.title"></span><span class="t-emoji" aria-hidden="true" data-i18n="testimonials.emoji"></span></h2>
  </div>

<!-- ============ 06 CONTACT (light) ============ -->
<section class="contact dark blobs" id="contact" aria-labelledby="cTitle">

<script>
(() => {
'use strict';
const C = CONFIG, T = C.translations;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
root.classList.add('js');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

let currentLang = C.defaultLang;           // language choice kept in memory only
const state = { tab: 'social', sub: 'sports', lbList: [], lbIndex: 0, lastFocus: null };

const t = path => path.split('.').reduce((o, k) => (o == null ? o : o[k]), T[currentLang]) ?? path;
const L = v => (v && typeof v === 'object') ? (v[currentLang] ?? v.en ?? '') : (v ?? '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');

Object.entries(C.colors).forEach(([k, v]) => root.style.setProperty('--' + k, v));

/* =====================================================================
   3D SHAPES — glossy "inflated" inline SVGs. Each takes a unique id prefix.
   To swap for PNG stickers use CONFIG.stickers.
   ===================================================================== */
let uidN = 0;
const uid = () => 'g' + (++uidN);
const PAL = {
  purple: ['#DCC8FF', '#7B3FF2', '#2A0C78'],
  pink:   ['#FFC4E4', '#FF3EA5', '#8E0B50'],
  orange: ['#FFDDB8', '#FF8A2B', '#9C3A05'],
  lime:   ['#FAFFD2', '#C9F23A', '#5E7A00'],
  blue:   ['#EEF4FF', '#5B8CFF', '#162F80'],
  dark:   ['#5A5A70', '#1D1D2A', '#050508']
};
const rg = (id, p, cx = '35%', cy = '28%', r = '78%') =>
  `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}"><stop offset="0" stop-color="${p[0]}"/><stop offset=".55" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></radialGradient>`;
const lg = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const blur = (id, d = 2.5) => `<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${d}"/></filter>`;
const shade = id => `<radialGradient id="${id}" cx="38%" cy="30%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>`;
const svg = inner => `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${inner}</svg>`;
const poly = (cx, cy, r, rot = -90, n = 5) => Array.from({ length: n }, (_, i) => {
  const a = (rot + i * 360 / n) * Math.PI / 180;
  return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
}).join(' ');
const STAR = 'M100 6 C108 68 132 92 194 100 C132 108 108 132 100 194 C92 132 68 108 6 100 C68 92 92 68 100 6 Z';

const SHAPES = {
  // Camera lens — social media / photography
  lens: u => svg(`<defs>${rg(u+'r', PAL.blue)}${rg(u+'b', PAL.dark, '50%', '40%', '70%')}<radialGradient id="${u}g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFB8E8"/><stop offset=".45" stop-color="#7B3FF2"/><stop offset="1" stop-color="#14062E"/></radialGradient>${blur(u+'f')}</defs>
    <circle cx="100" cy="100" r="88" fill="url(#${u}r)"/>
    <circle cx="100" cy="100" r="72" fill="#0B0B16"/>
    <circle cx="100" cy="100" r="64" fill="url(#${u}b)" stroke="#2C2C40" stroke-width="3"/>
    <circle cx="100" cy="100" r="46" fill="url(#${u}g)"/>
    <circle cx="100" cy="100" r="18" fill="#05050A"/>
    <path d="M30 78 A72 72 0 0 1 86 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75" filter="url(#${u}f)"/>
    <ellipse cx="84" cy="80" rx="15" ry="9" transform="rotate(-38 84 80)" fill="#fff" opacity=".85" filter="url(#${u}f)"/>
    <circle cx="121" cy="121" r="5" fill="#fff" opacity=".55"/>`),

  // Football — sports clients
  football: u => {
    const outer = [-54, 18, 90, 162, 234].map(a => { const r = a * Math.PI / 180; return `<polygon points="${poly(100 + 80 * Math.cos(r), 100 + 80 * Math.sin(r), 27, a + 180)}"/>`; }).join('');
    const seams = [-90, -18, 54, 126, 198].map(a => { const r = a * Math.PI / 180; return `<line x1="${(100 + 28 * Math.cos(r)).toFixed(1)}" y1="${(100 + 28 * Math.sin(r)).toFixed(1)}" x2="${(100 + 56 * Math.cos(r)).toFixed(1)}" y2="${(100 + 56 * Math.sin(r)).toFixed(1)}"/>`; }).join('');
    return svg(`<defs>${rg(u+'a', PAL.lime)}${rg(u+'p', PAL.purple)}${shade(u+'s')}<clipPath id="${u}c"><circle cx="100" cy="100" r="86"/></clipPath>${blur(u+'f', 4)}</defs>
      <circle cx="100" cy="100" r="86" fill="url(#${u}a)"/>
      <g clip-path="url(#${u}c)"><g fill="url(#${u}p)" stroke="#2A0C78" stroke-width="2" stroke-linejoin="round"><polygon points="${poly(100, 100, 28)}"/>${outer}</g><g stroke="#3D4F00" stroke-width="2.5" opacity=".55">${seams}</g></g>
      <circle cx="100" cy="100" r="86" fill="url(#${u}s)"/>
      <ellipse cx="70" cy="56" rx="28" ry="14" transform="rotate(-32 70 56)" fill="#fff" opacity=".75" filter="url(#${u}f)"/>`);
  },

  // Paper airplane — travel & tourism
  plane: u => svg(`<defs>${rg(u+'a', PAL.pink, '30%', '30%')}${rg(u+'b', PAL.orange, '70%', '30%')}${blur(u+'f', 2)}</defs>
    <path d="M14 186 C40 170 40 146 70 140" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".7"/>
    <g stroke-linejoin="round" stroke-width="10">
      <path d="M18 96 L184 40 L80 124 Z" fill="url(#${u}a)" stroke="#FF5DB4"/>
      <path d="M80 124 L184 40 L120 172 Z" fill="url(#${u}b)" stroke="#FF9A45"/>
      <path d="M80 124 L98 166 L106 140 Z" fill="#B0175F" stroke="#B0175F"/>
    </g>
    <path d="M36 94 L166 50" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7" filter="url(#${u}f)"/>
    <path d="M120 150 L170 66" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45" filter="url(#${u}f)"/>`),

  // Globe — travel & tourism
  globe: u => svg(`<defs>${rg(u+'b', PAL.blue)}${rg(u+'l', PAL.lime)}${lg(u+'o', '#FFC08A', '#FF3EA5')}${shade(u+'s')}<clipPath id="${u}c"><circle cx="100" cy="100" r="72"/></clipPath>${blur(u+'f', 4)}</defs>
    <ellipse cx="100" cy="100" rx="96" ry="30" transform="rotate(-20 100 100)" fill="none" stroke="url(#${u}o)" stroke-width="8" opacity=".9"/>
    <circle cx="100" cy="100" r="72" fill="url(#${u}b)"/>
    <g clip-path="url(#${u}c)">
      <g fill="url(#${u}l)">
        <path d="M58 62 C74 48 98 54 96 74 C94 92 76 90 72 108 C66 122 48 112 46 94 C44 80 48 70 58 62 Z"/>
        <path d="M118 108 C136 98 158 110 154 132 C150 152 128 160 118 148 C108 136 106 118 118 108 Z"/>
        <path d="M112 42 C126 36 146 44 142 58 C132 64 118 60 112 42 Z"/>
      </g>
      <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"><ellipse cx="100" cy="100" rx="34" ry="72"/><ellipse cx="100" cy="100" rx="72" ry="24"/></g>
    </g>
    <circle cx="100" cy="100" r="72" fill="url(#${u}s)"/>
    <ellipse cx="74" cy="60" rx="24" ry="12" transform="rotate(-32 74 60)" fill="#fff" opacity=".75" filter="url(#${u}f)"/>
    <path d="M4 100 A96 30 0 0 0 196 100" transform="rotate(-20 100 100)" fill="none" stroke="url(#${u}o)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="182" cy="62" r="10" fill="#D4F53C"/>`),

  // Graduation cap — school clients
  cap: u => svg(`<defs>${rg(u+'t', PAL.purple)}${rg(u+'b', ['#9B6BFF', '#4B1FB0', '#1C0850'], '40%', '20%')}${rg(u+'o', PAL.orange)}${blur(u+'f', 2.5)}</defs>
    <path d="M54 98 L54 138 C54 166 146 166 146 138 L146 98 Z" fill="url(#${u}b)"/>
    <path d="M14 82 L14 92 L100 132 L186 92 L186 82 Z" fill="#2A0C78" stroke="#2A0C78" stroke-width="8" stroke-linejoin="round"/>
    <path d="M100 40 L186 82 L100 124 L14 82 Z" fill="url(#${u}t)" stroke="#8E5BFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M100 54 L150 78" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6" filter="url(#${u}f)"/>
    <ellipse cx="74" cy="72" rx="24" ry="8" transform="rotate(-26 74 72)" fill="#fff" opacity=".45" filter="url(#${u}f)"/>
    <path d="M100 82 Q150 92 160 104 L160 140" fill="none" stroke="#FF8A2B" stroke-width="5" stroke-linecap="round"/>
    <rect x="150" y="134" width="20" height="38" rx="10" fill="url(#${u}o)"/>
    <circle cx="100" cy="82" r="9" fill="url(#${u}o)"/>`),

  // Sparkle + chip — AI
  ai: u => {
    const pins = [84, 100, 116].map(p => `<rect x="${p-3}" y="58" width="6" height="14" rx="3"/><rect x="${p-3}" y="128" width="6" height="14" rx="3"/><rect x="58" y="${p-3}" width="14" height="6" rx="3"/><rect x="128" y="${p-3}" width="14" height="6" rx="3"/>`).join('');
    return svg(`<defs>${rg(u+'p', PAL.pink)}${rg(u+'d', PAL.dark)}${blur(u+'f', 2.5)}</defs>
      <path d="${STAR}" fill="url(#${u}p)"/>
      <path d="M100 28 C104 60 116 80 140 92" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6" filter="url(#${u}f)"/>
      <g fill="#D4F53C">${pins}</g>
      <rect x="72" y="72" width="56" height="56" rx="14" fill="url(#${u}d)" stroke="#D4F53C" stroke-width="2"/>
      <text x="100" y="111" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="28" fill="#D4F53C">AI</text>
      <path d="${STAR}" fill="#D4F53C" transform="translate(146 18) scale(.2)"/>
      <path d="${STAR}" fill="#fff" transform="translate(22 148) scale(.14)"/>`);
  },

  // Pen-tool nib + bezier — logos
  pen: u => svg(`<defs>${rg(u+'n', PAL.blue, '30%', '30%')}${rg(u+'o', PAL.orange)}${blur(u+'f', 2)}</defs>
    <path d="M22 172 C50 120 36 72 78 58" fill="none" stroke="#FF3EA5" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="172" x2="8" y2="124" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="8" cy="124" r="6" fill="#D4F53C"/>
    <rect x="15" y="165" width="14" height="14" rx="3" fill="#fff"/>
    <g transform="rotate(20 120 110)">
      <path d="M120 196 L82 116 C82 90 94 70 98 56 L142 56 C146 70 158 90 158 116 Z" fill="url(#${u}n)" stroke="#3A5BD0" stroke-width="3" stroke-linejoin="round"/>
      <rect x="92" y="22" width="56" height="38" rx="12" fill="url(#${u}o)"/>
      <line x1="120" y1="122" x2="120" y2="192" stroke="#0E1F5C" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="120" cy="116" r="9" fill="#0E1F5C"/>
      <path d="M96 112 C96 92 104 78 108 66" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75" filter="url(#${u}f)"/>
      <rect x="100" y="28" width="30" height="7" rx="3.5" fill="#fff" opacity=".55"/>
    </g>`),

  // Play button — motion graphics
  play: u => svg(`<defs>${rg(u+'p', PAL.pink)}${lg(u+'w', '#FFFFFF', '#D4F53C')}${shade(u+'s')}${blur(u+'f', 3)}</defs>
    <rect x="12" y="24" width="176" height="152" rx="50" fill="url(#${u}p)"/>
    <rect x="12" y="24" width="176" height="152" rx="50" fill="url(#${u}s)"/>
    <path d="M86 72 L134 100 L86 128 Z" fill="url(#${u}w)" stroke="#F1FFC4" stroke-width="18" stroke-linejoin="round"/>
    <path d="M42 50 C62 38 100 36 130 40" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".7" filter="url(#${u}f)"/>`),

  // Printer + paper — prints
  printer: u => svg(`<defs>${lg(u+'pa', '#FFFFFF', '#D6DAE6')}${rg(u+'o', PAL.orange)}<radialGradient id="${u}s" cx="38%" cy="25%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>${blur(u+'f', 2.5)}</defs>
    <rect x="52" y="16" width="96" height="72" rx="8" fill="url(#${u}pa)"/>
    <rect x="64" y="30" width="50" height="6" rx="3" fill="#7B3FF2"/><rect x="64" y="44" width="70" height="6" rx="3" fill="#FF3EA5"/>
    <rect x="18" y="66" width="164" height="86" rx="28" fill="url(#${u}o)"/>
    <rect x="18" y="66" width="164" height="86" rx="28" fill="url(#${u}s)"/>
    <rect x="34" y="74" width="104" height="12" rx="6" fill="#fff" opacity=".5" filter="url(#${u}f)"/>
    <circle cx="156" cy="98" r="8" fill="#D4F53C"/><circle cx="134" cy="98" r="6" fill="#7B3FF2"/>
    <rect x="40" y="118" width="120" height="16" rx="8" fill="#3B1300"/>
    <path d="M52 126 L148 126 L154 190 L46 190 Z" fill="url(#${u}pa)" stroke="#E6E8EF" stroke-width="2" stroke-linejoin="round"/>
    <rect x="62" y="146" width="56" height="7" rx="3.5" fill="#7B3FF2"/><rect x="62" y="160" width="76" height="7" rx="3.5" fill="#FF3EA5"/><rect x="62" y="174" width="40" height="7" rx="3.5" fill="#FF8A2B"/>`)
};
const shapeMarkup = name => C.stickers[name]
  ? `<img src="${esc(C.stickers[name])}" alt="" loading="lazy" decoding="async">`
  : (SHAPES[name] ? SHAPES[name](uid()) : '');

// Flat geometric shapes for the footer marquee
const GEO = [
  c => `<circle cx="50" cy="50" r="44" fill="${c}"/>`,
  c => `<polygon points="50,6 94,90 6,90" fill="${c}" stroke="${c}" stroke-width="6" stroke-linejoin="round"/>`,
  c => `<rect x="16" y="16" width="68" height="68" rx="12" fill="${c}" transform="rotate(15 50 50)"/>`,
  c => `<path d="M50 4 L61 38 L96 38 L68 59 L79 94 L50 72 L21 94 L32 59 L4 38 L39 38 Z" fill="${c}"/>`,
  c => `<circle cx="50" cy="50" r="36" fill="none" stroke="${c}" stroke-width="14"/>`,
  c => `<path d="M6 72 A44 44 0 0 1 94 72 Z" fill="${c}"/>`,
  c => `<path d="M38 6h24v32h32v24H62v32H38V62H6V38h32z" fill="${c}"/>`,
  c => `<path d="M6 62 L22 38 L38 62 L54 38 L70 62 L86 38 L96 52" fill="none" stroke="${c}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`,
  c => `<path d="M50 4 C54 40 60 46 96 50 C60 54 54 60 50 96 C46 60 40 54 4 50 C40 46 46 40 50 4Z" fill="${c}"/>`
];

/* ---------- Placeholder images (lightweight generated SVGs) ---------- */
const CAT_COLORS = {
  schools:['#7B3FF2','#4F7CFF'], sports:['#B7E021','#FF8A2B'], travel:['#4F7CFF','#FF3EA5'],
  logos:['#FF3EA5','#7B3FF2'], prints:['#FF8A2B','#FF3EA5'], campaigns:['#7B3FF2','#FF8A2B'], motion:['#FF3EA5','#4F7CFF']
};
function placeholder(key, n, w = 800, h = 800) {
  const [a, b] = CAT_COLORS[key] || ['#7B3FF2', '#FF3EA5'];
  const m = Math.min(w, h);
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="${w*.78}" cy="${h*.3}" r="${m*.22}" fill="#fff" fill-opacity=".16"/><rect x="${w*.08}" y="${h*.08}" width="${w*.3}" height="${h*.14}" rx="${m*.04}" fill="#0A0A0A" fill-opacity=".14"/><text x="50%" y="${h*.5}" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="${m*.09}" fill="#fff">${key.toUpperCase()}</text><text x="50%" y="${h*.5 + m*.07}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${m*.03}" fill="#fff" fill-opacity=".9" letter-spacing="3">PLACEHOLDER · ${pad2(n)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}
const projKey = p => p.cat === 'social' ? p.sub : p.cat;
const projSrc = p => p.src || placeholder(projKey(p), C.projects.indexOf(p) + 1);
const projType = p => p.cat === 'social' ? `${t('projects.tabs.social')} · ${t('projects.subs.' + p.sub)}` : t('projects.tabs.' + p.cat);

/* =====================================================================
   RENDERERS
   ===================================================================== */
function renderShapes() {
  $$('.shape[data-shape]').forEach(el => { el.innerHTML = `<div class="float">${shapeMarkup(el.dataset.shape)}</div>`; });
}

function renderPortrait() {
  const el = $('#portrait');
  if (C.portrait.src) {
    el.innerHTML = `<div class="ring"></div><div class="fig"><div class="disc"></div><img src="${esc(C.portrait.src)}" alt="${esc(t('hero.portraitAlt'))}" decoding="async" fetchpriority="high"></div>`;
  } else {
    // PLACEHOLDER portrait silhouette
    el.innerHTML = `<div class="ring"></div><div class="disc"></div>
      <svg class="sil" viewBox="0 0 300 400" role="img" aria-label="${esc(t('hero.portraitAlt'))}"><defs><linearGradient id="silg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A33"/><stop offset="1" stop-color="#0E0E12"/></linearGradient></defs>
      <circle cx="150" cy="138" r="68" fill="url(#silg)" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
      <path d="M26 400 C26 282 88 226 150 226 C212 226 274 282 274 400 Z" fill="url(#silg)" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/></svg>
      <span class="ph">${esc(t('hero.portraitPh'))}</span>`;
  }
}

function renderMarquees() {
  const items = t('services.items');

/* =====================================================================

   ===================================================================== */
function fitHero() {
  const h = $('.hero-title'), lines = $$('.hero-title .ln');
  if (!h || lines.length < 2) return;
  const cw = h.parentElement.clientWidth;
  const narrow = innerWidth < 760;
  h.classList.toggle('stack', narrow);
  lines.forEach(l => { l.style.fontSize = '100px'; });
  if (!narrow) {
    const total = lines[0].getBoundingClientRect().width + lines[1].getBoundingClientRect().width + 22;
    const fs = Math.min(innerHeight * 0.34, 100 * cw / total * 0.98);
    lines.forEach(l => { l.style.fontSize = fs + 'px'; });
    h.style.columnGap = (fs * 0.22) + 'px';
  } else {
    h.style.columnGap = '0px';
    lines.forEach(l => { l.style.fontSize = Math.min(innerHeight * 0.2, 100 * cw / l.getBoundingClientRect().width * 0.96) + 'px'; });
  }
}
function fitAll() {
  fitHero();
  $$('.fit').forEach(el => {
    const box = el.parentElement;
    const cw = box.clientWidth;
    el.style.fontSize = '100px';
    const w = el.getBoundingClientRect().width;
    if (!w) return;
    const max = innerHeight * parseFloat(el.dataset.fitMax || '.5');
    el.style.fontSize = Math.min(max, 100 * cw / w * 0.98) + 'px';
  });
}

/* =====================================================================
   PARTICLE DISSOLVE — headline letters break into particles on scroll-out
   ===================================================================== */
const dissolvers = [];
function initDissolve() {
  $$('.dissolve').forEach(el => {
    const cv = document.createElement('canvas');
    cv.className = 'dz';
    cv.setAttribute('aria-hidden', 'true');
    el.appendChild(cv);
    dissolvers.push({ el, cv, ctx: cv.getContext('2d'), groups: null, p: -1 });
  });
}
function buildDissolve(d) {
  const r = d.el.getBoundingClientRect();
  const W = Math.ceil(r.width), H = Math.ceil(r.height);
  if (!W || !H) { d.groups = null; return; }
  const pad = 260, dpr = Math.min(2, devicePixelRatio || 1);
  d.W = W + pad * 2; d.H = H + pad * 2;
  Object.assign(d.cv.style, { left: -pad + 'px', top: -pad + 'px', width: d.W + 'px', height: d.H + 'px' });
  d.cv.width = d.W * dpr; d.cv.height = d.H * dpr;
  d.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // draw each word onto an offscreen canvas at its exact layout position
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d', { willReadFrequently: true });
  const rtl = root.dir === 'rtl';
  $$('.dw', d.el).forEach(w => {
    const wr = w.getBoundingClientRect(), cs = getComputedStyle(w);
    o.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    o.fillStyle = cs.color;
    o.direction = rtl ? 'rtl' : 'ltr';
    o.textAlign = rtl ? 'right' : 'left';
    o.textBaseline = 'alphabetic';
    const m = o.measureText(w.textContent);
    const fs = parseFloat(cs.fontSize);
    const asc = m.fontBoundingBoxAscent ?? fs * 0.8, desc = m.fontBoundingBoxDescent ?? fs * 0.2;
    const y = wr.top - r.top + (wr.height - (asc + desc)) / 2 + asc;
    o.fillText(w.textContent, rtl ? wr.right - r.left : wr.left - r.left, y);
  });

  const data = o.getImageData(0, 0, W, H).data;
  const step = Math.max(3, Math.round(W / 360));
  let seed = 1234567;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const groups = new Map();
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    const i = (y * W + x) * 4;
    if (data[i + 3] < 128) continue;
    const key = `rgb(${data[i] & 0xF0},${data[i + 1] & 0xF0},${data[i + 2] & 0xF0})`;
    const xn = x / W;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({
      x: x + pad, y: y + pad,
      dx: (rnd() * 2 - 1) * 150 + (rtl ? -1 : 1) * rnd() * 130,
      dy: -(60 + rnd() * 300),
      d: (rtl ? 1 - xn : xn) * 0.55 + rnd() * 0.25,
      ph: rnd() * 6.28
    });
  }
  d.groups = groups; d.step = step; d.p = -1;
}
function drawDissolve(d, p) {
  const c = d.ctx;
  c.clearRect(0, 0, d.W, d.H);
  if (p <= 0 || p >= 1.2 || !d.groups) return;
  const s = d.step + 0.5;
  for (const [col, arr] of d.groups) {
    c.fillStyle = col;
    for (const q of arr) {
      const k = (p * 1.8 - q.d) / 0.7;
      if (k >= 1) continue;
      if (k <= 0) { c.globalAlpha = 1; c.fillRect(q.x, q.y, s, s); continue; }
      const e = k * k, sz = s * (1 - 0.55 * k);
      c.globalAlpha = 1 - k;
      c.fillRect(q.x + q.dx * e + Math.sin(k * 6 + q.ph) * 12 * k, q.y + q.dy * e, sz, sz);
    }
  }
  c.globalAlpha = 1;
}

/* =====================================================================
   SCROLL LOOP — dissolve + parallax
   ===================================================================== */
let shapes = [], ticking = false;
function frame() {
  ticking = false;
  if (RM) return;
  const vh = innerHeight, sy = scrollY;
  dissolvers.forEach(d => {
    if (!d.groups) return;
    const r = d.el.getBoundingClientRect();
    const top = r.top + sy;
    const start = Math.max(0, top - vh * 0.35), end = top + r.height * 0.6 + vh * 0.4;
    const p = Math.max(0, Math.min(1.2, (sy - start) / (end - start)));
    if (Math.abs(p - d.p) < 0.0008) return;
    d.p = p;
    d.el.style.setProperty('--txt', Math.max(0, 1 - p * 6).toFixed(3));
    drawDissolve(d, p);
  });
  shapes.forEach(s => {
    const r = s.host.getBoundingClientRect();
    if (r.bottom < -200 || r.top > vh + 200) return;
    const off = (r.top + r.height / 2 - vh / 2) * s.speed;
    s.el.style.transform = `translate3d(0,${off.toFixed(1)}px,0) rotate(${(off * 0.04).toFixed(2)}deg)`;
  });
}
const requestFrame = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };

function layout() {
  fitAll();
  if (!RM) dissolvers.forEach(buildDissolve);
  dissolvers.forEach(d => { d.p = -1; });
  frame();
}

/* =====================================================================
   REVEAL + COUNTERS
   ===================================================================== */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => entries.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' }) : null;
function observeReveals(scope = document) {
  $$('.reveal:not(.in)', scope).forEach(el => io ? io.observe(el) : el.classList.add('in'));
}

function runCounters() {
  $$('.cnt').forEach(el => {
    const target = Number(C.counters[el.dataset.count]) || 0;
    if (RM) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 1800;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 4)));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* =====================================================================

   ===================================================================== */
const lb = $('#lb');
function openLb(list, index) {
  state.lbList = list; state.lbIndex = index; state.lbOpen = true;
  state.lastFocus = document.activeElement;
  showLb();
  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  $('.lb-close', lb).focus();
}
function showLb() {
  const p = state.lbList[state.lbIndex];
  if (!p) return;
  const img = $('#lbImg');
  img.src = p.full || projSrc(p);
  img.alt = [L(p.title), L(p.client)].filter(Boolean).join(" — ");
  $('#lbTitle').textContent = L(p.title);
  $('#lbMeta').textContent = [L(p.client), projType(p), p.year, `${state.lbIndex + 1}/${state.lbList.length}`].filter(Boolean).join(' · ');
  const multi = state.lbList.length > 1;
  $('.lb-prev', lb).hidden = !multi; $('.lb-next', lb).hidden = !multi;
}
function stepLb(dir) {
  const n = state.lbList.length;
  state.lbIndex = (state.lbIndex + dir + n) % n;
  showLb();
}
function closeLb() {
  state.lbOpen = false;
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (state.lastFocus) state.lastFocus.focus();
}
$('.lb-close', lb).addEventListener('click', closeLb);
$('.lb-prev', lb).addEventListener('click', () => stepLb(-1));
$('.lb-next', lb).addEventListener('click', () => stepLb(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!state.lbOpen) return;
  const rtl = root.dir === 'rtl';
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowRight') stepLb(rtl ? -1 : 1);
  else if (e.key === 'ArrowLeft') stepLb(rtl ? 1 : -1);
  else if (e.key === 'Tab') { // keep focus inside the dialog
    const f = $$('button:not([hidden])', lb), first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let touchX = null;
lb.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) stepLb((dx < 0) !== (root.dir === 'rtl') ? 1 : -1);
  touchX = null;
});

});
$$('#navLinks a').forEach(a => a.addEventListener('click', () => { nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); }));

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; renderTabs(); renderGrid();
});
$('#subtabs').addEventListener('click', e => {
  const b = e.target.closest('[data-sub]'); if (!b) return;
  state.sub = b.dataset.sub; renderTabs(); renderGrid();
});
// arrow-key navigation inside tab lists
['#tabs', '#subtabs'].forEach(sel => $(sel).addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const tabs = $$('.tab', e.currentTarget), i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const fwd = (e.key === 'ArrowRight') !== (root.dir === 'rtl');
  const next = tabs[(i + (fwd ? 1 : -1) + tabs.length) % tabs.length];
  next.focus(); next.click();
  const again = $(`${sel} [data-${next.dataset.tab ? 'tab' : 'sub'}="${next.dataset.tab || next.dataset.sub}"]`);
  if (again) again.focus();
}));

['#bento', '#featured'].forEach(sel => $(sel).addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  openLb(card.parentElement._list, Number(card.dataset.i));
}));

$('#waForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.currentTarget, err = $('#formErr');
  const fe = f.elements, name = fe.namedItem('name').value.trim(), email = fe.namedItem('email').value.trim(), msg = fe.namedItem('message').value.trim();
  if (!name || !msg || !/^\S+@\S+\.\S+$/.test(email)) { err.textContent = t('contact.form.error'); err.hidden = false; return; }
  err.hidden = true;
  const text = `${t('contact.form.waHello')}\n\n${t('contact.form.waName')}: ${name}\n${t('contact.form.waEmail')}: ${email}\n${t('contact.form.waMsg')}: ${msg}`;
  window.open(`https://wa.me/${C.social.whatsappNumber}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
});

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 160); });
addEventListener('scroll', requestFrame, { passive: true });

/* =====================================================================
   INIT
   ===================================================================== */
$('#year').textContent = new Date().getFullYear();
renderShapes();
shapes = $$('.shape[data-speed]').map(el => ({ el, host: el.closest('section') || el.parentElement, speed: parseFloat(el.dataset.speed) }));
initDissolve();
applyLang(currentLang);
observeReveals();
if (io) {
  const cio = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { runCounters(); cio.disconnect(); } }, { threshold: 0.4 });
  cio.observe($('#counters'));
} else runCounters();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

/* =====================================================================
   INTERACTIVITY — progress bar, cursor, card tilt, magnetic buttons, portrait parallax
   ===================================================================== */
const progress = $('#progress');
const onScrollUi = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  progress.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
  nav.classList.toggle('scrolled', scrollY > 10);
};
addEventListener('scroll', onScrollUi, { passive: true });
onScrollUi();

// card-in keeps transform:none while its fill-mode holds, so drop it once played to let tilt apply
['#bento', '#featured'].forEach(sel => $(sel).addEventListener('animationend', e => {
  if (e.animationName === 'cardIn') e.target.classList.remove('card-in');
}));

const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
if (finePointer && !RM) {
  const dot = $('#cursorDot'), ring = $('#cursorRing');
  let mx = -100, my = -100, rx = -100, ry = -100;
  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px)`;
    root.classList.add('has-cursor');
    ring.classList.toggle('big', !!e.target.closest('a,button,.card,.tab,.mq-tile'));
  }, { passive: true });
  document.addEventListener('mouseleave', () => root.classList.remove('has-cursor'));
  const follow = () => {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    ring.style.transform = `translate(${rx.toFixed(1)}px,${ry.toFixed(1)}px)`;
    requestAnimationFrame(follow);
  };
  follow();

  document.addEventListener('pointermove', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.setProperty('--ry', `${((x - 0.5) * 10).toFixed(2)}deg`);
    card.style.setProperty('--rx', `${((0.5 - y) * 8).toFixed(2)}deg`);
    card.style.setProperty('--mx', `${(x * 100).toFixed(1)}%`);
    card.style.setProperty('--my', `${(y * 100).toFixed(1)}%`);
  }, { passive: true });
  document.addEventListener('pointerout', e => {
    const card = e.target.closest('.card');
    if (card && !card.contains(e.relatedTarget)) { card.style.removeProperty('--rx'); card.style.removeProperty('--ry'); }
  });

  document.addEventListener('pointermove', e => {
    const pill = e.target.closest('.pill:not(.lb-btn)');
    if (!pill) return;
    const r = pill.getBoundingClientRect();
    pill.style.transform = `translate(${((e.clientX - r.left - r.width / 2) * 0.25).toFixed(1)}px,${((e.clientY - r.top - r.height / 2) * 0.35).toFixed(1)}px)`;
  }, { passive: true });
  document.addEventListener('pointerout', e => {
    const pill = e.target.closest('.pill');
    if (pill && !pill.contains(e.relatedTarget)) pill.style.transform = '';
  });

  const hero = $('#top'), portrait = $('#portrait');
  hero.addEventListener('pointermove', e => {
    const r = hero.getBoundingClientRect();
    portrait.style.setProperty('--px', `${(((e.clientX - r.left) / r.width - 0.5) * -24).toFixed(1)}px`);
    portrait.style.setProperty('--py', `${(((e.clientY - r.top) / r.height - 0.5) * -16).toFixed(1)}px`);
  }, { passive: true });
  hero.addEventListener('pointerleave', () => { portrait.style.removeProperty('--px'); portrait.style.removeProperty('--py'); });
}

/* Hover preview: resting the mouse on a card shows the whole design, on the side of the screen away from the card */
if (finePointer) {
  const hp = $('#hp'), hpImg = $('img', hp), hpTitle = $('strong', hp), hpMeta = $('span', hp);
  let hpCard = null, hpTimer = 0;
  const hideHp = () => { clearTimeout(hpTimer); hpCard = null; hp.classList.remove('show'); };
  const showHp = card => {
    const list = card.parentElement._list, p = list && list[Number(card.dataset.i)];
    if (!p || !p.src || state.lbOpen) return;
    hpImg.src = projSrc(p);
    if (p.full) { const big = new Image(); big.onload = () => { if (hpCard === card) hpImg.src = p.full; }; big.src = p.full; }
    hpImg.style.background = p.bg || '';
    hpTitle.textContent = L(p.title);
    hpMeta.textContent = [L(p.client), p.year].filter(Boolean).join(' · ');
    const r = card.getBoundingClientRect(), w = Math.min(innerWidth * 0.4, 560), gap = 28;
    const onLeft = r.left + r.width / 2 > innerWidth / 2;
    const x = onLeft ? Math.max(16, r.left - w - gap) : Math.min(innerWidth - w - 16, r.right + gap);
    hp.style.setProperty('--hx', `${Math.round(x)}px`);
    hp.classList.add('show');
  };
  ['#bento', '#featured'].forEach(sel => {
    const box = $(sel);
    box.addEventListener('pointerover', e => {
      const card = e.target.closest('.card');
      if (!card || card === hpCard) return;
      hpCard = card; clearTimeout(hpTimer);
      hpTimer = setTimeout(() => { if (hpCard === card) showHp(card); }, hp.classList.contains('show') ? 0 : 220);
    });
    box.addEventListener('pointerout', e => {
      const card = e.target.closest('.card');
      if (card && !card.contains(e.relatedTarget)) {
        if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.card')) return;
        hideHp();
      }
    });
    box.addEventListener('click', hideHp);
  });
  addEventListener('scroll', () => { if (hp.classList.contains('show')) hideHp(); }, { passive: true });
}
})();
</script>
</body>
</html>
